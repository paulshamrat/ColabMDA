title = "ColabMDA credential checks"

[extend]
useDefault = true

[[rules]]
id = "modeller-license"
description = "Hardcoded MODELLER license value"
regex = '''(?i)(?:key_modeller|modeller_license|\blicense)\s*["']?\s*(?:=|:)\s*(?:[ru]{0,2})?["']([A-Za-z0-9_-]{6,})["']'''
secretGroup = 1
keywords = ["key_modeller", "modeller_license", "license"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^YOUR_[A-Z_]+$''', '''^LOCAL_ONLY_TEST_KEY$''']

[[rules]]
id = "modeller-unquoted-license"
description = "Hardcoded unquoted MODELLER license value"
regex = '''(?i)(?:key_modeller|modeller_license)\s*=\s*([A-Za-z0-9_-]{6,})(?:\s|$)'''
secretGroup = 1
keywords = ["key_modeller", "modeller_license"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^YOUR_[A-Z_]+$''', '''^LOCAL_ONLY_TEST_KEY$''']

[[rules]]
id = "google-session-cookie"
description = "Google authentication cookie captured in source or notebook output"
regex = '''(?i)(?:__Secure-[13]P(?:SID|APISID|SIDCC|SIDTS)|SAPISID|APISID|HSID|SSID|SIDCC|SIDTS|LSID|\bSID)\s*["']?\s*(?:=|:)\s*["']?([^;"'\\\s]{16,})'''
secretGroup = 1
keywords = ["sapisid", "apisid", "hsid", "ssid", "sid", "__secure-"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^YOUR_[A-Z_]+$''']
