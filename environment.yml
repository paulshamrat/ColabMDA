name: colabmda
channels:
  - conda-forge
  - salilab  # For modeller
dependencies:
  - python=3.12
  - openmm>=8.5
  - pdbfixer
  - pdb2pqr
  - propka
  - mdanalysis
  - mdtraj
  - numpy
  - matplotlib
  - biopython
  - pandas
  - scipy
  - modeller
  - rdkit
  - meeko
  - vina
  - ambertools
  - pip
  - pip:
    - -e .
