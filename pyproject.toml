[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colabmda"
version = "0.2.0"
description = "Colab-friendly modelling + MD workflows (Modeller + OpenMM)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Shamrat Kumar Paul"}]

dependencies = [
  "numpy",
  "biopython",
]

[project.optional-dependencies]
analysis = [
  "mdanalysis",
  "mdtraj",
  "matplotlib",
  "pandas",
]
docking = [
  "rdkit",
  "meeko",
  "vina",
]

[project.scripts]
colabmda = "colabmda.cli:main"
cmda = "colabmda.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "ci_test_env",
    "notebooks",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # Ignore long lines (handled by black)

[tool.ruff.lint.isort]
known-first-party = ["colabmda"]

[tool.setuptools.data-files]
"share/colabmda/examples/hpc" = ["examples/hpc/*.slurm"]
"share/colabmda/examples/trpcage/scripts/01_structure" = ["examples/trpcage/scripts/01_structure/*.py"]
"share/colabmda/examples/trpcage/scripts/02_simulation" = ["examples/trpcage/scripts/02_simulation/*.sh", "examples/trpcage/scripts/02_simulation/*.py"]
"share/colabmda/examples/fkbp/scripts/01_structure" = ["examples/fkbp/scripts/01_structure/*.py"]
"share/colabmda/examples/fkbp/scripts/02_simulation" = ["examples/fkbp/scripts/02_simulation/*.py"]
"share/colabmda/examples/hras/scripts/01_structure" = ["examples/hras/scripts/01_structure/*.py"]
"share/colabmda/examples/hras/scripts/02_simulation" = ["examples/hras/scripts/02_simulation/*.py"]
