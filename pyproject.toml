[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colabmda"
version = "0.1.0"
description = "Colab-friendly modelling + MD workflows (Modeller + OpenMM)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Shamrat Kumar Paul"}]

dependencies = [
  "numpy",
  "matplotlib",
  "biopython",
  "mdanalysis",
  "mdtraj",
  "pandas",
]

[project.scripts]
colabmda = "colabmda.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "B", "I"]
ignore = ["E501"] # Ignore line length errors (handled by black)
exclude = [
    "notebooks",
    "analysis",
    "scripts",
    "openmm",
    "python",
    "setup_colabgmx_inprogress_250714.py",
]
